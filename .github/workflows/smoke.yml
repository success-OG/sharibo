name: Smoke Test & Evidence Freshness

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Create .env
        run: |
          echo "SHARIBO_CONTRACT_ID=CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC" > .env
          echo "STELLAR_RPC_URL=https://soroban-testnet.stellar.org" >> .env
          echo "STELLAR_HORIZON_URL=https://horizon-testnet.stellar.org" >> .env
          echo "STELLAR_NETWORK_PASSPHRASE=\"Test SDF Network ; September 2015\"" >> .env

      - name: Run Smoke Test
        id: smoke
        run: npx tsx scripts/smoke.ts
        continue-on-error: true

      - name: Create Issue on Failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "🚨 Testnet Reset Detected (Evidence Stale)";
            const body = "The scheduled smoke test failed, which usually indicates that the Stellar testnet has reset. Please follow the [Testnet Reset Runbook](https://github.com/${{ github.repository }}/blob/main/docs/runbook-testnet-reset.md) to update the deployed contract IDs and evidence hashes.";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'testnet-reset',
            });
            const dup = existing.data.find(i => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Still failing as of run https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              });
              return;
            }
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ["bug", "testnet-reset"]
            })
