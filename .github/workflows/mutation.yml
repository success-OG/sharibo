name: Mutation Testing

on:
  schedule:
    - cron: "0 3 * * *" # Run nightly at 3 AM
  workflow_dispatch:

jobs:
  mutate:
    name: Stryker Mutation Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run mutation testing
        run: npm run mutate --workspace=packages/client

      - name: Open Issue on Failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const issueTitle = '🚨 Mutation Testing Failed';
            const issueBody = `The scheduled mutation testing run failed. This could indicate a regression in mutation score below the required \`break\` threshold.\n\nSee run here: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated',
            });
            const dup = existing.data.find(i => i.title === issueTitle);
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Still failing as of run https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['bug', 'automated']
            });
